name: 'Generate Artefact Version'
description: 'Generates a draft artefact version using latest Git tag and short commit SHA'
author: 'HMCTS'
inputs:
  release:
    description: 'Set to "true" to use the Git tag only (no short SHA). Default is "false".'
    required: false
    default: 'false'
  tag-match:
    description: 'Glob pattern passed to `git describe --match` when resolving the latest tag in draft mode. Use this to filter tags when `refs/tags/*` is shared with non-semver tags (e.g. `v*` to ignore `deploy-*` deploy tags). Default `*` preserves the previous behaviour of matching every tag.'
    required: false
    default: '*'
outputs:
  draft_version:
    description: 'The generated draft version (e.g., 0.1.4-a1b2c3d)'
    value: ${{ steps.vars.outputs.draft_version }}
  release_version:
    description: 'The latest git tag without the "v" prefix (e.g., 0.1.4)'
    value: ${{ steps.vars.outputs.release_version }}
runs:
  using: 'composite'
  steps:
    - name: Generate artefact version
      id: vars
      shell: bash
      run: ${{ github.action_path }}/entrypoint.sh
      env:
        INPUT_RELEASE: ${{ inputs.release }}
        INPUT_TAG_MATCH: ${{ inputs.tag-match }}
branding:
  icon: tag
  color: blue
